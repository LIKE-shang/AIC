# Ground straight run with a frozen heading. 20261018_v3
#
# Coordinates are in the `map` frame, the same frame
# slam_navigation/PointsCloud2toLaserscan + transform_fusion publish after ICP
# alignment.  Check them against the live prior map before driving:
#   python3 tools/check_waypoints.py --config config/straight_run.yaml
#
# `relative` is measured from the chassis nose at the instant the run starts:
# first number forward along the nose, second number to its left.  `map` is
# absolute.  Use one or the other per waypoint.

waypoints:
  # Placeholder demo: 1 m forward, then back. Replace with real map targets.
  - relative: [1.0, 0.0]
  - relative: [0.0, 0.0]

max_speed_mps: 0.15
min_speed_mps: 0.03
pos_gain_per_s: 1.2
accel_limit_mps2: 0.4
decel_limit_mps2: 0.4

arrive_tolerance_m: 0.02
arrive_cycles: 5
dwell_s: 0.5

pose_timeout_s: 0.5
waypoint_timeout_s: 60.0
control_rate_hz: 20.0

yaw_warn_rad: 0.05
yaw_abort_rad: 0.15

max_run_distance_m: 4.0
